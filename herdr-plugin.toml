# Herdr plugin manifest
# Docs: https://herdr.dev/docs/plugins/
# Note: every `command` is an argv array. Herdr does not run it through a shell,
# so there is no variable expansion here.
# Runtime working directory is the plugin root (HERDR_PLUGIN_ROOT); scripts locate
# themselves through `import.meta.url`, so these relative paths are safe.

id = "herdr-parallel-sessions-display"
name = "Herdr Parallel Sessions Display"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Show parallel running sessions of OpenCode / Codex / Claude Code in Herdr's Agents sidebar, grouped by space directory."
platforms = ["linux", "macos"]

# One-shot init hook: runs once after Herdr restores the session.
# It only does two things: replay the agent view projection and (optionally) start
# the detached watchdog, then exits. No resident logic lives here --
# [[startup]] is a one-shot hook, not a supervised daemon.
#
# This hook firing once per server lifetime is exactly why the manager cannot depend
# on it for liveness. The watchdog (spawned here) is what keeps the manager alive.
[[startup]]
command = ["node", "src/board.mjs", "--mode", "startup"]

# Makes sure the resident manager is running (and its watchdog is watching it).
# This is the recovery entry point: the manager no longer lives in a pane, so this
# no longer opens a window -- it starts the detached process if it is missing.
[[actions]]
id = "board"
title = "Ensure Sessions Board Is Running"
contexts = ["workspace"]
command = ["node", "src/board.mjs", "--mode", "action", "--action", "board"]

# Trigger a full recompute immediately.
[[actions]]
id = "sync"
title = "Sync Parallel Sessions Now"
contexts = ["workspace"]
command = ["node", "src/board.mjs", "--mode", "action", "--action", "sync"]

# Reap every mirror row and mirror pane (sessions that are still running come back
# on the next sync).
[[actions]]
id = "reap"
title = "Clean Up Mirror Session Rows"
contexts = ["workspace"]
command = ["node", "src/board.mjs", "--mode", "action", "--action", "reap"]

# The resident manager runs DETACHED from any pane -- see the comment block at the
# top of src/board.mjs for why (a pane-hosted manager gets killed every time the
# user closes that tab, and [[startup]] fires only once per server lifetime, so the
# sidebar silently freezes forever).
#
# This pane entry is kept as a log viewer. In normal operation the detached manager
# already holds the board lock, so this process exits immediately after printing why
# -- it is not the resident process. The log is at $HERDR_PLUGIN_STATE_DIR/board.log.
[[panes]]
id = "board"
title = "Herdr Sessions (log)"
placement = "tab"
command = ["node", "src/board.mjs", "--mode", "pane"]

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "herdr-parallel-sessions-display.board"
description = "Make sure the parallel sessions board is running"
